name: Build Android (APK/AAB) — VibeCine

on:
  workflow_dispatch:          # acionamento manual
  push:
    tags: ["android-v*"]      # ou por tag  (ex.: android-v2.0.0)

jobs:
  apk:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python (build)
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Dependências do sistema (p4a)
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip openjdk-17-jdk python3-pip \
            autoconf libtool pkg-config zlib1g-dev libncurses5-dev \
            libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev \
            libegl1 libgl1

      - name: Configurar Android SDK
        run: |
          # Instalar Android SDK command line tools
          SDK_DIR="${HOME}/android-sdk"
          mkdir -p "${SDK_DIR}/cmdline-tools"
          cd "${SDK_DIR}/cmdline-tools"
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O cmdline-tools.zip
          unzip -q cmdline-tools.zip
          mv cmdline-tools latest
          cd ..
          rm cmdline-tools.zip

          # Configurar variáveis de ambiente
          export ANDROID_SDK_ROOT="${SDK_DIR}"
          export ANDROID_HOME="${SDK_DIR}"
          export PATH="${SDK_DIR}/cmdline-tools/latest/bin:${SDK_DIR}/platform-tools:${PATH}"

          # Aceitar licenças automaticamente
          yes | sdkmanager --licenses > /dev/null 2>&1

          # Instalar componentes necessários do SDK
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0" "cmdline-tools;latest" > /dev/null 2>&1

          # Verificar instalações
          sdkmanager --list_installed | grep -E "(platform-tools|platforms;android-34|build-tools;34.0.0|cmdline-tools)"

      - name: Setup Python (build)
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Dependências do sistema (p4a)
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip openjdk-17-jdk python3-pip \
            autoconf libtool pkg-config zlib1g-dev libncurses5-dev \
            libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev \
            libegl1 libgl1

      - name: Configurar variáveis de ambiente Android
        run: |
          echo "ANDROID_SDK_ROOT=${HOME}/android-sdk" >> $GITHUB_ENV
          echo "ANDROID_HOME=${HOME}/android-sdk" >> $GITHUB_ENV
          echo "${HOME}/android-sdk/cmdline-tools/latest/bin:${HOME}/android-sdk/platform-tools:\$PATH" >> $GITHUB_PATH

      - name: Dependências Python do build
        run: pip3 install --upgrade buildozer "cython==0.29.37"

      - name: Testes do core (sem UI/Qt)
        run: |
          pip3 install qrcode pillow yt-dlp plyer kivy kivymd PySide6
          python3 -m unittest \
            tests.test_m3u_parser tests.test_url_router tests.test_config \
            tests.test_errors tests.test_downloader tests.test_history \
            tests.test_share tests.test_fase6 tests.test_android

      - name: Cache do Buildozer
        uses: actions/cache@v4
        with:
          path: .buildozer
          key: buildozer-${{ hashFiles('buildozer.spec') }}
          restore-keys: buildozer-

      - name: Gerar APK (debug)
        run: buildozer -v android debug

      - name: Publicar artefato APK
        uses: actions/upload-artifact@v4
        with:
          name: vibecine-apk
          path: bin/*.apk

  aab:
    needs: apk
    runs-on: ubuntu-22.04
    # AAB (release) só em tags android-v*; exige chave de assinatura.
    if: startsWith(github.ref, 'refs/tags/android-v')
    steps:
      - uses: actions/checkout@v4

      - name: Configurar Android SDK
        run: |
          # Instalar Android SDK command line tools
          SDK_DIR="${HOME}/android-sdk"
          mkdir -p "${SDK_DIR}/cmdline-tools"
          cd "${SDK_DIR}/cmdline-tools"
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O cmdline-tools.zip
          unzip -q cmdline-tools.zip
          mv cmdline-tools latest
          cd ..
          rm cmdline-tools.zip

          # Configurar variáveis de ambiente
          export ANDROID_SDK_ROOT="${SDK_DIR}"
          export ANDROID_HOME="${SDK_DIR}"
          export PATH="${SDK_DIR}/cmdline-tools/latest/bin:${SDK_DIR}/platform-tools:${PATH}"

          # Aceitar licenças automaticamente
          yes | sdkmanager --licenses > /dev/null 2>&1

          # Instalar componentes necessários do SDK
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0" "cmdline-tools;latest" > /dev/null 2>&1

          # Verificar instalações
          sdkmanager --list_installed | grep -E "(platform-tools|platforms;android-34|build-tools;34.0.0|cmdline-tools)"

      - name: Setup Python (build)
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Configurar variáveis de ambiente Android
        run: |
          echo "ANDROID_SDK_ROOT=${HOME}/android-sdk" >> $GITHUB_ENV
          echo "ANDROID_HOME=${HOME}/android-sdk" >> $GITHUB_ENV
          echo "${HOME}/android-sdk/cmdline-tools/latest/bin:${HOME}/android-sdk/platform-tools:\$PATH" >> $GITHUB_PATH

      - run: |
          sudo apt-get update && sudo apt-get install -y git zip unzip \
            openjdk-17-jdk python3-pip autoconf libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake \
            libffi-dev libssl-dev
          pip3 install --upgrade buildozer "cython==0.29.37"
      - uses: actions/cache@v4
        with:
          path: .buildozer
          key: buildozer-${{ hashFiles('buildozer.spec') }}
          restore-keys: buildozer-
      # Assinatura: defina os secrets KEYSTORE_B64/KEYSTORE_PASSWORD e o bloco
      # [app] android.release_artifact... (ver docs/ANDROID.md, seção AAB).
      - name: Gerar AAB (release — requer keystore via secrets)
        run: buildozer -v android release
      - uses: actions/upload-artifact@v4
        with:
          name: vibecine-aab
          path: bin/*.aab
